name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Real Windows Git/Credential Locker integration cases take substantially
    # longer than POSIX; keep the complete suite and a bounded diagnostic budget.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Validate Windows client registration
        if: matrix.os == 'windows-latest'
        run: node --test --test-name-pattern="client smoke validates a disposable registration lifecycle" test/unit/quality-scripts.test.mjs
      - run: npm run test:ci
      # package-gate chooses npm.cmd on Windows; exercise that launcher in CI
      # instead of relying solely on the Linux release-gate job.
      - name: Validate package contents on Windows
        if: matrix.os == 'windows-latest'
        run: npm run package:check

  quality:
    name: Release gate
    # This job has its own checkout and test run. Start it immediately so a
    # queued platform runner cannot delay Linux coverage and package validation.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Upload sanitized quality summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-summaries
          path: |
            artifacts/test-summary.json
            artifacts/package-contents.json
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

  required:
    name: CI required
    if: ${{ always() }}
    needs: ['test', 'quality', 'merge-policy']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("Unsuccessful prerequisites: " + ", ".join(failed))
          PY
  merge-policy:
    name: Validate merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github/tests -p 'test_merge_validated_pr.py'
