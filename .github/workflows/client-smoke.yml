name: Client smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install the pinned Codex CLI without lifecycle scripts
        shell: bash
        env:
          CODEX_VERSION: 0.160.0
          CODEX_TARBALL_INTEGRITY: sha512-kEtVGzjRAYAMOwJxN39bGcna7LT3IDQgq64NNJ/dDTfu4OzZaocJcyNb5/gGJ/IVF/Vj7oK7E2m3nmTan7lpjg==
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          package="$(npm pack "@openai/codex@${CODEX_VERSION}" --ignore-scripts --json | node -e 'let text = ""; process.stdin.on("data", (chunk) => (text += chunk)); process.stdin.on("end", () => process.stdout.write(JSON.parse(text)[0].filename));')"
          actual="sha512-$(openssl dgst -sha512 -binary "$package" | base64 -w 0)"
          test "$actual" = "$CODEX_TARBALL_INTEGRITY"
          install_prefix="$RUNNER_TEMP/offload-codex"
          npm install --prefix "$install_prefix" --ignore-scripts "$package"
          echo "$install_prefix/node_modules/.bin" >> "$GITHUB_PATH"
          "$install_prefix/node_modules/.bin/codex" --version
      - name: Exercise Codex registration in a disposable home
        run: node scripts/client-smoke.mjs --clients=codex
