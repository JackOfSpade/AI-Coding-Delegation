name: Client smoke

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Comma-separated installed clients to exercise in a disposable home
        required: true
        default: claude,codex,cursor
        type: string

permissions:
  contents: read

concurrency:
  group: client-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-smoke:
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Exercise requested clients in a disposable home
        env:
          OFFLOAD_CLIENTS: ${{ inputs.clients }}
        run: node scripts/client-smoke.mjs
